<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pak-a-boo</title></head>
  <body>
    <main>
      <header><span class="mark"><svg viewBox="28 34 136 150" width="27" height="29" aria-hidden="true"><path d="M106 38 C142 38 160 70 160 108 C160 134 156 154 152 168 C150 177 141 179 137 170 C133 160 124 160 120 170 C116 180 107 180 103 170 C99 160 90 160 86 170 C82 179 72 179 68 169 C64 159 55 160 50 167 C44 176 35 173 33 162 C31 148 38 126 44 110 C48 68 72 38 106 38 Z" fill="#FBFFFC" stroke="#000000" stroke-width="7" stroke-linejoin="round"/><path d="M62 78 C70 60 84 50 100 48 C86 56 74 68 68 84 Z" fill="#FFFFFF" opacity=".9"/><ellipse cx="72" cy="98" rx="11" ry="7" fill="#E5AFAC" opacity=".6"/><ellipse cx="132" cy="98" rx="11" ry="7" fill="#E5AFAC" opacity=".6"/><ellipse cx="86" cy="98" rx="11" ry="14" fill="#1F2B2E"/><circle cx="90" cy="90" r="4.2" fill="#fff"/><ellipse cx="126" cy="98" rx="11" ry="14" fill="#1F2B2E"/><circle cx="130" cy="90" r="4.2" fill="#fff"/><path d="M97 118 Q106 128 115 118" fill="none" stroke="#1F2B2E" stroke-width="5" stroke-linecap="round"/></svg></span><div class="head-text"><h1>Pak-a-boo</h1><p id="tagline"></p></div><div class="lang-switch" role="group" aria-label="Language"><button type="button" data-lang="en" class="lang-btn">EN</button><button type="button" data-lang="th" class="lang-btn">TH</button></div></header>
      <section class="next"><button id="reset" class="reset-btn" type="button"><svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6M16.5 3v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="eyebrow" id="next-peek-label"></span><strong id="countdown">--:--</strong><span id="break-label"></span></section>
      <div class="actions"><button id="focus"></button><button id="power"></button></div>
      <section class="stats"><div><strong id="breaks">0</strong><span id="breaks-label"></span></div><div><strong id="screen-time">0m</strong><span id="screen-time-label"></span></div><div><strong id="status"></strong></div></section>
      <section class="skins">
        <div class="character-row" role="group" aria-label="Character">
          <button type="button" class="character-btn" data-character="ghost"></button>
          <button type="button" class="character-btn" data-character="blob"></button>
          <button type="button" class="character-btn" data-character="buggy"></button>
        </div>
        <div class="streak-card">
          <span class="streak-flame" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 2 C13 6 17 8 17 13 C17 17.5 14.5 20 12 20 C9.5 20 7 17.5 7 13 C7 11 8 10 8.5 9 C8.5 11 10 11.5 10.5 10.5 C9 7 10 4 12 2 Z" fill="#F3A93B" stroke="#3E5750" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
          <div class="streak-info">
            <strong id="streak-count">0</strong>
            <div class="streak-caption-row">
              <span id="streak-caption"></span>
              <button id="streak-help" class="streak-help" type="button"><svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 9v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="6.2" r="1.1" fill="currentColor"/></svg></button>
            </div>
          </div>
          <div class="streak-progress" id="streak-progress">
            <i class="streak-dot"></i>
            <i class="streak-dot"></i>
            <i class="streak-dot"></i>
          </div>
        </div>
        <!-- Five fixed slots, rendered by popup.ts from SKIN_REGISTRY: Mr.Boo (whatever
             he is wearing today), the streak ladder, and the legendary slot. -->
        <div class="skin-row" role="group" aria-label="Ghost skins"></div>
      </section>
      <footer><a id="cocoa-link" href="https://ko-fi.com/iamacatperson" target="_blank" rel="noopener noreferrer"></a><span id="version"></span></footer>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
